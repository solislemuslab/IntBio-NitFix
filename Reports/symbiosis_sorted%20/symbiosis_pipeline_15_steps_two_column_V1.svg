<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 26px Arial, sans-serif; fill: #17202a; }
      .label { font: 700 22px Arial, sans-serif; fill: #17202a; }
      .body { font: 400 18px Arial, sans-serif; fill: #263238; }
      .small { font: 400 16px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .num { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .panel { fill: #e9eef5; rx: 12; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .input { fill: #eef6ff; stroke: #7aa7d9; }
      .process { fill: #f1fbf5; stroke: #6abf8a; }
      .qc { fill: #fff7e6; stroke: #d7a648; }
      .target { fill: #f7efff; stroke: #a47bd4; }
      .tree { fill: #eef7f7; stroke: #5aa6a6; }
      .next { fill: #fff0f2; stroke: #d46a7a; }
      .pill { fill: #253858; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .turn { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="13" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <path d="M0,0 L13,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1500"/>
  <text class="title" x="60" y="66">symbiosis_sorted Functional-Gene Pipeline</text>
  <text class="subtitle" x="60" y="102">All 15 report steps, ordered left-to-right and top-to-bottom</text>

  <!-- Top input/goal -->
  <rect class="panel" x="45" y="135" width="1710" height="170"/>
  <text class="section" x="75" y="178">Input and Goal</text>
  <rect class="card input" x="80" y="205" width="370" height="70"/>
  <text class="label" x="105" y="235">Input 1: reads</text>
  <text class="tiny" x="105" y="260">symbiosis_sorted FASTQ; 1,116 paired samples</text>
  <rect class="card input" x="495" y="205" width="370" height="70"/>
  <text class="label" x="520" y="235">Input 2: reference</text>
  <text class="tiny" x="520" y="260">symbiosis_islands.fasta from Ryan</text>
  <rect class="card input" x="910" y="205" width="370" height="70"/>
  <text class="label" x="935" y="235">Input 3: annotation</text>
  <text class="tiny" x="935" y="260">symbiosis_islands.gb + gene list</text>
  <rect class="card input" x="1325" y="205" width="370" height="70"/>
  <text class="label" x="1350" y="235">Goal</text>
  <text class="tiny" x="1350" y="260">pilot nifH tree, then final nif and nod trees</text>
  <path class="arrow" d="M450 240 H485"/>
  <path class="arrow" d="M865 240 H900"/>
  <path class="arrow" d="M1280 240 H1315"/>

  <!-- Step panels -->
  <rect class="panel" x="45" y="335" width="825" height="1035"/>
  <text class="section" x="75" y="380">Steps 1-8</text>

  <rect class="panel" x="930" y="335" width="825" height="1035"/>
  <text class="section" x="960" y="380">Steps 9-15</text>

  <!-- left column cards -->
  <rect class="card process" x="80" y="410" width="755" height="78"/>
  <circle class="pill" cx="110" cy="440" r="19"/><text class="num" x="105" y="447">1</text>
  <text class="label" x="145" y="438">Copy raw reads into processed-data</text>
  <text class="small" x="145" y="466">Output: raw_symbiosis_full R1/R2 files; 1,116 paired samples.</text>

  <rect class="card process" x="80" y="515" width="755" height="78"/>
  <circle class="pill" cx="110" cy="545" r="19"/><text class="num" x="105" y="552">2</text>
  <text class="label" x="145" y="543">Trim reads with fastp</text>
  <text class="small" x="145" y="571">Clean adapters, low-quality bases, poly-G/poly-X, and short reads.</text>

  <rect class="card qc" x="80" y="620" width="755" height="78"/>
  <circle class="pill" cx="110" cy="650" r="19"/><text class="num" x="105" y="657">3</text>
  <text class="label" x="145" y="648">Check trimming quality</text>
  <text class="small" x="145" y="676">Read retention 95.84%; Q30 improved from 95.39% to 97.49%.</text>

  <rect class="card process" x="80" y="725" width="755" height="78"/>
  <circle class="pill" cx="110" cy="755" r="19"/><text class="num" x="105" y="762">4</text>
  <text class="label" x="145" y="753">Map reads to Ryan's symbiosis reference</text>
  <text class="small" x="145" y="781">Map P1/P2 reads to symbiosis_islands.fasta; output 1,116 BAM files.</text>

  <rect class="card qc" x="80" y="830" width="755" height="78"/>
  <circle class="pill" cx="110" cy="860" r="19"/><text class="num" x="105" y="867">5</text>
  <text class="label" x="145" y="858">Check mapping quality</text>
  <text class="small" x="145" y="886">Mean mapped reads 93.3%; mean properly paired reads 85.0%.</text>

  <rect class="card target" x="80" y="935" width="755" height="135"/>
  <circle class="pill" cx="110" cy="965" r="19"/><text class="num" x="105" y="972">6</text>
  <text class="label" x="145" y="963">Extract central nif/nod target regions</text>
  <text class="small" x="145" y="993">Use symbiosis_islands.gb to locate genes and the gene list to decide which central nif/nod genes to extract.</text>
  <text class="small" x="145" y="1020">The extracted FASTA contains reference target sequences, not sample reads.</text>
  <text class="small" x="145" y="1047">Result: 231 unique targets = 169 nif + 62 nod.</text>

  <rect class="card qc" x="80" y="1097" width="755" height="78"/>
  <circle class="pill" cx="110" cy="1127" r="19"/><text class="num" x="105" y="1134">7</text>
  <text class="label" x="145" y="1125">Check BLAN controls</text>
  <text class="small" x="145" y="1153">All 12 BLAN controls showed target-associated signal; use BLAN as background QC.</text>

  <rect class="card target" x="80" y="1202" width="755" height="78"/>
  <circle class="pill" cx="110" cy="1232" r="19"/><text class="num" x="105" y="1239">8</text>
  <text class="label" x="145" y="1230">Match targets back to Ryan's original FASTA</text>
  <text class="small" x="145" y="1258">All 231 extracted targets matched; 233 exact reference locations found.</text>

  <!-- left arrows -->
  <path class="arrow" d="M457 488 V505"/>
  <path class="arrow" d="M457 593 V610"/>
  <path class="arrow" d="M457 698 V715"/>
  <path class="arrow" d="M457 803 V820"/>
  <path class="arrow" d="M457 908 V925"/>
  <path class="arrow" d="M457 1070 V1087"/>
  <path class="arrow" d="M457 1175 V1192"/>

  <!-- connector from 8 to 9 -->
  <path class="turn" d="M835 1241 C885 1241 885 450 930 450"/>

  <!-- right column cards -->
  <rect class="card target" x="965" y="410" width="755" height="78"/>
  <circle class="pill" cx="995" cy="440" r="19"/><text class="num" x="990" y="447">9</text>
  <text class="label" x="1030" y="438">Measure coverage for each target in each sample</text>
  <text class="small" x="1030" y="466">Output: 260,028 sample-by-target rows with percent covered and depth.</text>

  <rect class="card target" x="965" y="515" width="755" height="78"/>
  <circle class="pill" cx="995" cy="545" r="19"/><text class="num" x="985" y="552">10</text>
  <text class="label" x="1030" y="543">Summarize coverage by sample type</text>
  <text class="small" x="1030" y="571">Compare BLAN, No, Rh, Ro; good coverage = percent &gt;= 80 and mean depth &gt;= 10.</text>

  <rect class="card target" x="965" y="620" width="755" height="78"/>
  <circle class="pill" cx="995" cy="650" r="19"/><text class="num" x="985" y="657">11</text>
  <text class="label" x="1030" y="648">Rank targets with blank-aware filtering</text>
  <text class="small" x="1030" y="676">Choose targets strong in nodule samples and low in BLAN; 19 PROMISING targets.</text>

  <rect class="card tree" x="965" y="725" width="755" height="78"/>
  <circle class="pill" cx="995" cy="755" r="19"/><text class="num" x="985" y="762">12</text>
  <text class="label" x="1030" y="753">Extract pilot nifH consensus sequences</text>
  <text class="small" x="1030" y="781">Use many 150 bp reads to build one 894 bp nifH consensus per sample; 104 pass N &lt;= 5%.</text>

  <rect class="card tree" x="965" y="830" width="755" height="78"/>
  <circle class="pill" cx="995" cy="860" r="19"/><text class="num" x="985" y="867">13</text>
  <text class="label" x="1030" y="858">Align nifH sequences with MAFFT</text>
  <text class="small" x="1030" y="886">Line up 104 high-quality nifH sequences; alignment length 894 bp.</text>

  <rect class="card tree" x="965" y="935" width="755" height="78"/>
  <circle class="pill" cx="995" cy="965" r="19"/><text class="num" x="985" y="972">14</text>
  <text class="label" x="1030" y="963">Build pilot nifH tree with IQ-TREE</text>
  <text class="small" x="1030" y="991">Maximum-likelihood tree; model GTR+F+I+G4; 1000 bootstrap replicates.</text>

  <rect class="card tree" x="965" y="1040" width="755" height="78"/>
  <circle class="pill" cx="995" cy="1070" r="19"/><text class="num" x="985" y="1077">15</text>
  <text class="label" x="1030" y="1068">Visualize tree in iTOL</text>
  <text class="small" x="1030" y="1096">Report-ready tree figure; tips are nodule samples from nifH ref63.</text>

  <!-- right arrows -->
  <path class="arrow" d="M1342 488 V505"/>
  <path class="arrow" d="M1342 593 V610"/>
  <path class="arrow" d="M1342 698 V715"/>
  <path class="arrow" d="M1342 803 V820"/>
  <path class="arrow" d="M1342 908 V925"/>
  <path class="arrow" d="M1342 1013 V1030"/>

  <!-- Bottom summary -->
  <rect class="card next" x="80" y="1400" width="1640" height="70"/>
  <text class="section" x="110" y="1433">Main message</text>
  <text class="body" x="340" y="1433">Ryan's symbiosis_sorted data produced a pilot sample-level nifH phylogeny: 104 high-quality nodule consensus sequences, 894 bp alignment, IQ-TREE tree.</text>
</svg>
