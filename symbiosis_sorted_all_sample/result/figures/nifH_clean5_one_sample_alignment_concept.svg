<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <rect width="1500" height="920" fill="#ffffff"/>

  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 400 21px Arial, sans-serif; fill: #344155; }
    .panel-title { font: 700 25px Arial, sans-serif; fill: #172033; }
    .label { font: 700 18px Arial, sans-serif; fill: #172033; }
    .small { font: 400 16px Arial, sans-serif; fill: #344155; }
    .mono { font: 500 17px "Menlo", "Consolas", monospace; fill: #172033; }
    .tiny { font: 400 14px Arial, sans-serif; fill: #344155; }
    .panel { fill: #f3f6fa; stroke: #d4dce8; stroke-width: 2; rx: 12; }
    .ref { stroke-width: 16; stroke-linecap: round; }
    .read { stroke: #2f72df; stroke-width: 9; stroke-linecap: round; }
    .read2 { stroke: #78a8f2; stroke-width: 9; stroke-linecap: round; }
    .arrow { stroke: #6d7a8c; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    .dash { stroke-dasharray: 7 7; }
    .gap { fill: #dfe5ee; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6d7a8c"/>
    </marker>
  </defs>

  <text x="60" y="60" class="title">One Sample Can Contribute Several nifH Target Sequences</text>
  <text x="60" y="94" class="subtitle">Example: one biological sample has reads mapping to five clean nifH reference regions. The five sequences are aligned together by MAFFT; they are not merged into one long sequence.</text>

  <rect x="45" y="130" width="430" height="700" class="panel"/>
  <text x="75" y="175" class="panel-title">A. One sample's reads</text>
  <text x="75" y="207" class="small">Short reads from the same sample map to different nifH references.</text>
  <text x="75" y="244" class="label">Sample: example-1-No</text>
  <text x="75" y="278" class="tiny">Each blue bar is one 150 bp read.</text>

  <line x1="105" y1="335" x2="250" y2="335" class="read"/>
  <line x1="165" y1="365" x2="330" y2="365" class="read2"/>
  <line x1="115" y1="425" x2="270" y2="425" class="read"/>
  <line x1="210" y1="455" x2="370" y2="455" class="read2"/>
  <line x1="90" y1="515" x2="255" y2="515" class="read"/>
  <line x1="165" y1="545" x2="315" y2="545" class="read2"/>
  <line x1="130" y1="605" x2="305" y2="605" class="read"/>
  <line x1="230" y1="635" x2="392" y2="635" class="read2"/>
  <line x1="110" y1="695" x2="275" y2="695" class="read"/>
  <line x1="195" y1="725" x2="365" y2="725" class="read2"/>

  <path d="M 400 350 C 475 350, 475 245, 550 245" class="arrow"/>
  <path d="M 400 440 C 480 440, 480 345, 550 345" class="arrow"/>
  <path d="M 400 530 C 480 530, 480 445, 550 445" class="arrow"/>
  <path d="M 400 620 C 480 620, 480 545, 550 545" class="arrow"/>
  <path d="M 400 710 C 480 710, 480 645, 550 645" class="arrow"/>

  <rect x="520" y="130" width="430" height="700" class="panel"/>
  <text x="550" y="175" class="panel-title">B. Five clean nifH targets</text>
  <text x="550" y="207" class="small">The same sample may have good coverage for more than one nifH target.</text>

  <text x="550" y="250" class="label">ref52</text>
  <line x1="640" y1="245" x2="895" y2="245" class="ref" stroke="#1B9E77"/>
  <text x="640" y="278" class="tiny">one consensus sequence for sample|ref52</text>

  <text x="550" y="350" class="label">ref56</text>
  <line x1="640" y1="345" x2="895" y2="345" class="ref" stroke="#D95F02"/>
  <text x="640" y="378" class="tiny">one consensus sequence for sample|ref56</text>

  <text x="550" y="450" class="label">ref60</text>
  <line x1="640" y1="445" x2="895" y2="445" class="ref" stroke="#7570B3"/>
  <text x="640" y="478" class="tiny">one consensus sequence for sample|ref60</text>

  <text x="550" y="550" class="label">ref62</text>
  <line x1="640" y1="545" x2="895" y2="545" class="ref" stroke="#E7298A"/>
  <text x="640" y="578" class="tiny">one consensus sequence for sample|ref62</text>

  <text x="550" y="650" class="label">ref63</text>
  <line x1="640" y1="645" x2="895" y2="645" class="ref" stroke="#66A61E"/>
  <text x="640" y="678" class="tiny">one consensus sequence for sample|ref63</text>

  <path d="M 930 445 C 990 445, 990 445, 1045 445" class="arrow"/>

  <rect x="990" y="130" width="460" height="700" class="panel"/>
  <text x="1020" y="175" class="panel-title">C. MAFFT alignment</text>
  <text x="1020" y="207" class="small">MAFFT lines up the five nifH sequences as rows in one alignment.</text>
  <text x="1020" y="240" class="small">It does not concatenate them into one 4410 bp sequence.</text>

  <text x="1020" y="305" class="mono">example-1-No|ref52</text>
  <rect x="1215" y="287" width="14" height="24" class="gap"/>
  <rect x="1234" y="287" width="14" height="24" class="gap"/>
  <text x="1260" y="305" class="mono">ATGGCAGGT--CTG...</text>

  <text x="1020" y="365" class="mono">example-1-No|ref56</text>
  <text x="1260" y="365" class="mono">ATGGCAGGTCAGCTG...</text>

  <text x="1020" y="425" class="mono">example-1-No|ref60</text>
  <rect x="1296" y="407" width="14" height="24" class="gap"/>
  <text x="1260" y="425" class="mono">ATGGCAGGTCA-CTG...</text>

  <text x="1020" y="485" class="mono">example-1-No|ref62</text>
  <rect x="1215" y="467" width="14" height="24" class="gap"/>
  <rect x="1234" y="467" width="14" height="24" class="gap"/>
  <text x="1260" y="485" class="mono">ATGGCAGGT--CTG...</text>

  <text x="1020" y="545" class="mono">example-1-No|ref63</text>
  <rect x="1355" y="527" width="14" height="24" class="gap"/>
  <rect x="1374" y="527" width="14" height="24" class="gap"/>
  <text x="1260" y="545" class="mono">ATGGCAGGTCTG--...</text>

  <line x1="1020" y1="600" x2="1410" y2="600" stroke="#c7d0dd" stroke-width="2"/>
  <text x="1020" y="640" class="label">Result</text>
  <text x="1020" y="672" class="small">Five separate tree tips for this sample if all five targets pass QC.</text>
  <text x="1020" y="704" class="small">In our clean5 strict dataset, most samples pass 1-3 targets; only a few pass all five.</text>
  <text x="1020" y="746" class="label">Alignment length</text>
  <text x="1020" y="778" class="small">Rows are padded with gaps, so the clean5 MAFFT alignment has 1061 columns.</text>
</svg>
